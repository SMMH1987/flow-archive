# ساختار سازمان جهانی + لایهٔ ایران — منبع واحد (SSOT) — نسخه 1 — 2026-11-21 13:10 UTC (14:10 برلین)
# تأیید Siax 2026-11-21 13:03 UTC: منبع yaml است؛ c4-org/org-global.c4 فقط خودکار از این فایل ساخته می‌شود (python tools/build_org_c4.py) و دستی ویرایش نمی‌شود.
# بخش (department) → واحد (unit). mode: ask/auto/gate · external: yes/no/? · ir: true = فقط لایهٔ ایران (#loc_ir، تأییدنشده → حق‌پرس)
# منابع: APQC PCF Cross-Industry 7.x، Porter Value Chain، COSO ERM، ISO 37000/31000/27001/9001، ITIL 4، SCOR (از حافظه، بررسی‌نشده)
# ایجنت‌های هر واحد: c4-org/org-agents.yaml
departments:
