  - {id: ceo, mode: auto, n: مدیرعامل / دفتر مدیرعامل, ir: false, desc: اجرای راهبرد، هماهنگی بخش‌ها, external: 'no'}
  - {id: strategy_pmo, mode: ask, n: برنامه‌ریزی راهبردی و PMO, ir: false, desc: OKR، بودجهٔ سالانه، سبد پروژه, external: 'no'}
  - {id: corpdev, mode: gate, n: توسعهٔ کسب‌وکار و M&A, ir: false, desc: ادغام، خرید، سرمایه‌گذاری, external: '?'}
