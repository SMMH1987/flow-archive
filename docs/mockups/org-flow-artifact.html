<title>استودیوی سازمان</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<style>
/* چیدمان: بوم فلوچارت با خطوط شنا (lane) برای هر نقش؛ کنارش پنل ویرایش؛ دو صفحهٔ دیگر برای interop و خروجی */
:root{
  --font:'Vazirmatn',Tahoma,'Segoe UI',system-ui,sans-serif;
  --bg:#edf0f4;--card:#ffffff;--ink:#16202e;--mute:#5d6b7e;--line:#d5dbe4;
  --lane:#f7f9fb;--dot:#cdd5df;--acc:#0b7285;--accbg:#e3f3f6;
  --ask:#d98a00;--askbg:#fff3d6;--auto:#2f8f4e;--autobg:#e4f5ea;--gate:#d13438;--gatebg:#fde8e8;--route:#4f5bd5;--routebg:#e9ebfb;
  --proj:#0b7285;--projbg:#dff2f5;--edge:#8795a8;--warnbg:#fff4d6;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171e;--card:#1b222c;--ink:#e6ebf2;--mute:#9aa7b8;--line:#2c3644;--lane:#171d26;--dot:#2a3340;--acc:#4cc2d6;--accbg:#173540;
  --ask:#f0b030;--askbg:#3a2f12;--auto:#58c27a;--autobg:#16301f;--gate:#ff6b6e;--gatebg:#3d1a1c;--route:#8f99ff;--routebg:#22264a;
  --proj:#4cc2d6;--projbg:#14313a;--edge:#6f7d90;--warnbg:#3a3118;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171e;--card:#1b222c;--ink:#e6ebf2;--mute:#9aa7b8;--line:#2c3644;--lane:#171d26;--dot:#2a3340;--acc:#4cc2d6;--accbg:#173540;
  --ask:#f0b030;--askbg:#3a2f12;--auto:#58c27a;--autobg:#16301f;--gate:#ff6b6e;--gatebg:#3d1a1c;--route:#8f99ff;--routebg:#22264a;
  --proj:#4cc2d6;--projbg:#14313a;--edge:#6f7d90;--warnbg:#3a3118;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.7}
#app{padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:3px 10px}
button:hover:not(:disabled){border-color:var(--acc)}button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button.pri{background:var(--acc);color:var(--card);border-color:var(--acc)}button.on{background:var(--accbg);border-color:var(--acc);color:var(--acc)}
button.sm{padding:0 8px;font-size:12px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:3px 8px;width:100%;min-width:0}
input:disabled,select:disabled,textarea:disabled{opacity:.6;cursor:not-allowed}
input[type=checkbox],input[type=radio]{width:auto}
.ltr{direction:ltr;text-align:left;unicode-bidi:plaintext}.mute,small{color:var(--mute)}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.top h1{font-size:18px;font-weight:800;margin:0;flex:1 1 220px;min-width:0}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button.on{background:var(--acc);color:var(--card);border-color:var(--acc)}
.flowwrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;align-items:start}
@media(max-width:960px){.flowwrap{grid-template-columns:minmax(0,1fr)}}
#cv{position:relative;overflow:hidden;height:calc(100vh - 110px);min-height:460px;border:1px solid var(--line);border-radius:12px;background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:22px 22px;touch-action:none;cursor:grab;direction:ltr}
#cv.conn{cursor:crosshair}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#edges .hit{pointer-events:stroke;cursor:pointer}
.lane{position:absolute;background:var(--lane);border:1px solid var(--line);border-radius:14px}
.lane.locked{border-color:var(--gate);border-style:dashed}
.lane.proj{background:var(--projbg);border-color:var(--proj)}
.lane.sel{outline:3px solid var(--acc)}
.lh{position:absolute;left:0;right:0;top:0;height:44px;padding:6px 12px;font-weight:800;font-size:13px;line-height:1.35;cursor:move;direction:rtl;display:flex;gap:6px;align-items:center}
.lh span.t{flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.grp{position:absolute;direction:rtl;text-align:right;display:flex;gap:8px;align-items:center;justify-content:flex-start;flex-direction:row-reverse}
.grp b{font-size:17px;font-weight:800}.grp small{font-size:12px}
.node{position:absolute;direction:rtl;text-align:right;padding:5px 12px;background:var(--card);border:2px solid var(--line);cursor:grab;overflow:hidden;display:flex;flex-direction:column;justify-content:center;user-select:none}
.node .nt{font-size:13px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.node .ns{font-size:10.5px;color:var(--mute);direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node.askStep{border-color:var(--ask);background:var(--askbg);border-radius:20px}
.node.autoStep{border-color:var(--auto);background:var(--autobg);border-radius:5px}
.node.gateStep{border-color:var(--gate);background:var(--gatebg);border-radius:3px;border-width:3px;box-shadow:inset 0 0 0 2px var(--card)}
.node.routeStep{border:0;background:var(--route);clip-path:polygon(9% 0,91% 0,100% 50%,91% 100%,9% 100%,0 50%);align-items:center;text-align:center;padding:5px 26px}
.node.routeStep::before{content:'';position:absolute;inset:2px;background:var(--routebg);clip-path:polygon(9% 0,91% 0,100% 50%,91% 100%,9% 100%,0 50%)}
.node.routeStep>*{position:relative}
.node.tool{border-style:dashed;border-color:var(--proj);border-radius:6px}.node.tool.gated{border-color:var(--gate);background:var(--gatebg)}
.node.actor{border:2px dashed var(--acc);background:var(--accbg);border-radius:30px;align-items:center}
.node.locked{background-image:repeating-linear-gradient(135deg,transparent 0 9px,color-mix(in srgb,var(--gate) 13%,transparent) 9px 18px)}
.node.sel{box-shadow:0 0 0 4px var(--acc)}.node.src{box-shadow:0 0 0 4px var(--ask)}
.node.routeStep.sel{filter:drop-shadow(0 0 4px var(--acc))}
.nb{display:inline-block;font-size:10px;border:1px solid var(--line);border-radius:8px;padding:0 5px;margin-inline-end:3px;background:var(--card);color:var(--mute)}
.nb.red{background:var(--gate);border-color:var(--gate);color:var(--card)}
.cvtools{position:absolute;top:8px;left:8px;z-index:5;display:flex;gap:4px;flex-direction:column;direction:rtl}
.cvhint{position:absolute;bottom:8px;right:10px;font-size:12px;color:var(--mute);pointer-events:none;direction:rtl;background:var(--bg);border-radius:8px;padding:0 8px;max-width:calc(100% - 80px)}
.side{position:sticky;top:8px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 30px);overflow:auto}
@media(max-width:960px){.side{position:static;max-height:none}#cv{height:70vh}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.panel h2{font-size:14px;margin:0 0 6px;font-weight:800}
.f{display:block;margin-top:6px}.f>span{display:block;font-size:12px;color:var(--mute)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.row>*{flex:0 0 auto}.row>.grow{flex:1 1 120px;min-width:0}
.edge{border-top:1px dashed var(--line);padding:4px 0;font-size:13px}
.badge{display:inline-block;border-radius:10px;padding:0 8px;font-size:12px;border:1px solid var(--line)}
.badge.red{background:var(--gate);color:var(--card);border-color:var(--gate)}.badge.ok{background:var(--auto);color:var(--card);border-color:var(--auto)}
.warn{background:var(--warnbg);border:1px solid var(--ask);border-radius:8px;padding:6px 8px;margin-top:6px;font-size:13px}
.lockbox{background:var(--gatebg);border:1px solid var(--gate);border-radius:8px;padding:6px 8px;margin-top:6px;font-size:13px}
.legend{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:13px}
.legend i{display:block;width:46px;height:22px;border:2px solid;font-style:normal}
.page{padding-block:4px}
.proj{background:var(--card);border:1px solid var(--line);border-inline-start:6px solid var(--proj);border-radius:12px;padding:12px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 12px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
td,th{border-bottom:1px solid var(--line);padding:3px 4px;text-align:start;vertical-align:middle}
.chk{padding:0;margin:6px 0 0}.chk li{list-style:none}
pre{direction:ltr;text-align:left;max-height:60vh;overflow:auto;background:var(--bg);border:1px solid var(--line);padding:8px;border-radius:8px;font-size:12px;white-space:pre}
.diffs li{margin:2px 0}
.modal{position:fixed;inset:0;background:rgba(10,15,22,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;max-width:420px;width:100%}
.mbox p{margin:0 0 12px}

.nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px;direction:rtl}
.lt{position:absolute;text-align:center;direction:rtl;display:flex;flex-direction:column;align-items:center;gap:0;pointer-events:none}
.lt b{font-size:18px;font-weight:800}.lt small{font-size:12px}
.frame{position:absolute;border:2px dashed var(--line);border-radius:12px;background:color-mix(in srgb,var(--lane) 70%,transparent)}
.node{cursor:pointer}
.node .nt{font-size:13.5px}.node .ns{font-size:11px}
.node .no{font-size:12px;line-height:1.4;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.node.routeStep .no{display:none}
.conn{position:absolute;height:28px;line-height:24px;padding:0 12px;border:1.5px solid var(--proj);background:var(--projbg);border-radius:14px;direction:rtl;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;font-size:12px}
.card2{position:absolute;direction:rtl;text-align:right;background:transparent;border:2px solid var(--edge);border-radius:14px;padding:8px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.card2:hover{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 5%,transparent)}.card2.sel{box-shadow:0 0 0 4px var(--acc)}
.card2.locked{border-color:var(--gate);border-style:dashed}.card2.project{border-color:var(--proj)}
.card2 .ct{font-weight:800;font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-inline-end:30px;height:38px}
.card2 .cs{font-size:12px;color:var(--mute)}
.card2 .cc{position:absolute;right:10px;left:10px;bottom:6px;display:flex;gap:4px;flex-wrap:nowrap;overflow:hidden}
.chip2{font-size:11px;border:1px solid var(--proj);background:var(--projbg);border-radius:10px;padding:0 8px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.card2 .edit{position:absolute;top:6px;left:6px;padding:0 6px}
.empty{position:absolute;left:300px;top:120px;width:400px;text-align:center;direction:rtl}
.addrow{position:absolute;text-align:center;direction:rtl}
.lanebox{position:absolute;border:2px solid var(--edge);border-radius:16px;background:transparent}.lanebox.locked{border-color:var(--gate);border-style:dashed}
.lt2{position:absolute;top:8px;left:0;right:0;text-align:center;direction:rtl;display:flex;flex-direction:column;align-items:center;pointer-events:none}.lt2 b{font-size:16px;font-weight:800}.lt2 small{font-size:11.5px}
.node[style*='height:36px'] .ns,.node[style*='height:28px'] .ns{display:none}.node[style*='height:36px'] .nt,.node[style*='height:28px'] .nt{font-size:11.5px;-webkit-line-clamp:1}.node[style*='height:36px'],.node[style*='height:28px']{padding:1px 8px}.node.routeStep[style*='height:36px']{padding:1px 18px}
.vers{display:flex;gap:4px;flex-wrap:wrap}.vers button.on{background:var(--ask);border-color:var(--ask);color:var(--card);font-weight:600}
#p-dia.v3{grid-template-columns:230px minmax(0,1fr) 340px}
@media(max-width:1200px){#p-dia.v3{grid-template-columns:minmax(0,1fr) 340px}#p-dia.v3 #tree{grid-column:1/-1;max-height:200px}}
@media(max-width:960px){#p-dia.v3{grid-template-columns:minmax(0,1fr)}}
.fh{display:flex;align-items:center;gap:8px}.fh .ft{cursor:pointer;flex:1}.fh .ft:hover{text-decoration:underline}.lanebox.foc{outline:3px solid var(--acc);outline-offset:2px}.node.foc{outline:3px solid var(--acc);outline-offset:2px}.crumbs{display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center}
.tree{max-height:calc(100vh - 110px);overflow:auto;padding:8px}.tree h2{font-size:13px}
.tr{display:flex;gap:2px;align-items:center;font-size:12.5px;line-height:1.5;border-radius:6px;padding:0 2px}
.tr.cur{background:var(--accbg);font-weight:800}.tr.sel .tl{text-decoration:underline}
.tr .tg{width:18px;padding:0;border:0;background:transparent;text-align:center;color:var(--mute);flex:0 0 18px}
.tr .tl{cursor:pointer;flex:1;min-width:0}
.dive{position:absolute;top:2px;left:4px;padding:0 6px;font-size:11px;z-index:2}
.tgbtn{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);padding:1px 10px;font-size:11.5px;z-index:2;white-space:nowrap;background:var(--card);border:1.5px solid var(--acc);color:var(--acc);border-radius:999px;font-weight:700;cursor:pointer}.tgbtn.fr{bottom:7px}.tgbtn:hover{background:var(--accbg)}
.fh .cnt{font-weight:500;font-size:11.5px;color:var(--mute)}.lanebox.ext{border-style:dashed;border-color:var(--proj);background:color-mix(in srgb,var(--proj) 5%,transparent)}.lanebox.ext .fh{cursor:default;color:var(--proj)}.node.ext{border-style:dashed;border-color:var(--proj);background:var(--projbg);border-radius:10px}.node.ext .xb{font-size:10.5px;font-weight:800;color:var(--proj);margin-bottom:2px}
.fh{position:absolute;top:0;left:0;right:0;height:36px;display:flex;align-items:center;gap:8px;padding:0 14px;direction:rtl;font-weight:800;font-size:13.5px;cursor:pointer}
.fh:hover{background:color-mix(in srgb,var(--acc) 7%,transparent);border-radius:14px 14px 0 0}
.fh .ed{margin-inline-start:auto}
.lanebox .anct{position:absolute;top:6px;right:14px;direction:rtl;font-size:12px;font-weight:700;color:var(--mute);cursor:pointer}
.lanebox.anc{border-color:var(--line)}
.node.role,.node.section,.node.project,.node.orgBox{background:transparent;border:2px solid var(--edge);border-radius:12px}
.node.project{border-color:var(--proj)}
</style>
<div id="app">
  <div class="top">
    <h1>استودیوی سازمان <small>— فلوچارت زنده؛ ویرایش کن، خروجی = متن کامل <span class="ltr">recruitment.c4</span></small></h1>
    <nav class="tabs" id="tabs"></nav>
    <span class="vers" id="vers"></span>
    <button id="undo" title="برگشت (Ctrl+Z)">↶ برگشت</button>
    <button id="load">بارگذاری .c4</button>
    <button id="reset">بازنشانی به نمونه</button>
    <input type="file" id="file" accept=".c4,.txt,text/plain" hidden>
  </div>
  <div id="p-dia" class="flowwrap">
    <aside id="tree" class="panel tree" hidden></aside>
    <div style="min-width:0"><div id="nav" class="nav"></div>
    <div id="cv">
      <div id="world"></div>
      <div class="cvtools">
        <button id="zin" title="بزرگ‌نمایی">＋</button><button id="zout" title="کوچک‌نمایی">－</button>
        <button id="zfit" title="کل نمودار در یک نگاه">⤢</button>
        <button id="bconn" title="رسم فلش: اول مبدأ بعد مقصد">↔ فلش</button>
      </div>
      <div class="cvhint" id="cvhint"></div>
    </div></div>
    <aside class="side" id="insp"></aside>
  </div>
  <div id="p-int" class="page" hidden></div>
  <div id="p-out" class="page" hidden></div>
</div>
<script type="text/plain" id="base-c4">// نمونهٔ «سازمان کامل از یک ایده» — ایده: اتوماسیون کامل استخدام — 2026-11-06
// هر بخش = یک نقش سازمانی · هر قدم: technology = skill · description = out · آیکون = وضعیت قفل
// 🔒 = قفل (فقط با تأیید تو) · 🔓 = باز · tag designed = بخش ناشناخته که از ترکیب skillها طراحی شد
// رنگ قدم = نوع after: ask نارنجی · auto سبز · gate قرمز · route بنفش

specification {
  element actor {
    style {
      shape person
      color secondary
    }
  }
  element orgBox {
    style {
      color slate
    }
  }
  element role {
    style {
      color muted
    }
  }
  element askStep {
    notation "after: ask — خروجی را نشان بده و نظر بگیر"
    style {
      color amber
    }
  }
  element autoStep {
    notation "after: auto — خودکار برو قدم بعد"
    style {
      color green
    }
  }
  element gateStep {
    notation "after: gate — بایست تا کاربر تأیید کند"
    style {
      color red
    }
  }
  element routeStep {
    notation "after: route — شاخه را از روی نتیجه انتخاب کن"
    style {
      color indigo
      shape queue
    }
  }
  element flow {
    style {
      color slate
    }
  }
  element section {
    style {
      color muted
    }
  }
  element project {
    notation "پروژهٔ قابل‌فراخوانی — Claude MCP + OpenAI/REST"
    style {
      color sky
      shape component
    }
  }
  element tool {
    notation "ابزار پروژه — با #gated = پشت تأیید انسانی"
    style {
      color secondary
    }
  }
  tag locked
  tag designed
  tag unknownSkill
  tag gated
}

model {
  owner = actor 'مدیر / کارفرما' {
    description 'ایده می‌دهد · در دروازه‌ها تأیید می‌کند · قفل را او می‌زند'
  }
  candidate = actor 'کاندیدا' {
    description 'آگهی را می‌بیند · پرسشنامه پر می‌کند · مصاحبه می‌دهد'
  }

  company = orgBox 'سازمان اتوماسیون استخدام' {
    description '۹ نقش · هر قدم با skill خودش · بخش ناشناخته از skill طراحی شده'

    r1 = role '🔓 1 · استراتژیست استخدام' {
      icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/compass.svg
      goal = askStep 'هدف و نقش' {
        icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/unlock.svg
        technology 'skill: identify-assumptions-new'
        description 'out: نقش + تعداد + بودجه + فرض‌های پرخطر'
      }
      spec = askStep 'شرح شغل و معیار موفقیت' {
        icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/unlock.svg
        technology 'skill: first-principles'
        description 'out: وظایف + مهارت‌های ضروری + معیار ۹۰ روز'
      }
    }

    r2 = role '🔓 2 · نویسندهٔ آگهی و برند کارفرما' {
      icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/pencil-square.svg
      ad = autoStep 'طراحی آگهی' {
        icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/unlock.svg
        technology 'skill: marketing-skills:copywriting'
        description 'out: متن آگهی + ۳ تیتر + CTA'
      }
      brand = autoStep 'لحن و هویت کارفرما' {
        icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/unlock.svg
        technology 'skill: ui-brand'
        description 'out: لحن + ۳ جمله دربارهٔ فرهنگ سازمان'
      }
    }

    r3 = role '🔓 3 · مدیر انتشار و جذب' {
      icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/megaphone.svg
      post = gateStep 'انتشار آگهی' {
        icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/unlock.svg
        technology 'skill: marketing-skills:social'
        description 'out: پیش‌نویس برای هر کانال؛ انتشار فقط بعد از تأیید'
      }
      track = autoStep 'ردیابی منبع رزومه' {

  if(c==='/'&&s[i+1]==='/'&&(i===0||/\s/.test(s[i-1]))){while(i<s.length&&s[i]!=='\n')i++;continue}

function tokenize(s){const t=[];let i=0,nl=0;

    if(/\s/.test(c)){i++;continue}
    if(c==='/'&&s[i+1]==='/'){while(i<s.length&&s[i]!=='\n')i++;continue}
    if(c==="'"||c==='"'){let j=i+1,v='';while(j<s.length&&s[j]!==c){if(s[j]==='\\'){v+=s[j+1];j+=2}else v+=s[j++]}t.push({t:'str',v,nl});nl=0;i=j+1;continue}
    if(c==='{'||c==='}'){t.push({t:c,nl});nl=0;i++;continue}
    if(c==='-'&&s[i+1]==='>'){t.push({t:'->',nl});nl=0;i+=2;continue}
    if(c==='='){t.push({t:'=',nl});nl=0;i++;continue}
    let j=i;while(j<s.length&&!/[\s{}'"=]/.test(s[j])&&!(s[j]==='-'&&s[j+1]==='>'))j++;
    t.push({t:'w',v:s.slice(i,j),nl});nl=0;i=j}

function parseItems(tk,st,cpath){

  while(st.p<tk.length&&tk[st.p].t!=='}'){
    const k=tk[st.p],nx=tk[st.p+1];
    if(k.t!=='w'){st.p++;continue}
    if(k.v[0]==='#'){o.tags.push(k.v.slice(1));st.p++}
    else if(nx&&nx.t==='='){
      const n={id:k.v,kind:tk[st.p+2].v,title:tk[st.p+3].v,gap:k.nl>=2,tags:[],children:[]};st.p+=4;
      if(tk[st.p]&&tk[st.p].t==='{'){st.p++;Object.assign(n,parseItems(tk,st,cpath.concat(n.id)));st.p++}
      o.children.push(n)}
    else if(nx&&nx.t==='->'){
      const r={from:k.v,to:tk[st.p+2].v,c:cpath,gap:k.nl>=2};st.p+=3;
      if(tk[st.p]&&tk[st.p].t==='str'){r.label=tk[st.p].v;st.p++}
      st.rels.push(r)}
    else if(k.v==='icon'&&nx){o.icon=nx.v;st.p+=2}
    else if(k.v==='technology'&&nx){o.tech=nx.v;st.p+=2}
    else if(k.v==='description'&&nx){o.desc=nx.v;st.p+=2}
    else if(k.v==='metadata'&&nx&&nx.t==='{'){st.p+=2;o.meta=[];
      while(tk[st.p]&&tk[st.p].t!=='}'){o.meta.push([tk[st.p].v,tk[st.p+1].v]);st.p+=2}st.p++}

function parseC4(text){

  const root=parseItems(tokenize(text.slice(mo+1,mc)),st,[]);
  const M={pre:text.slice(0,mi),mid:text.slice(mc+1,vi<0?text.length:vi),views:vi<0?'':text.slice(vi),nodes:root.children,rels:st.rels};
  const idx=new Map();walk(M.nodes,'',(n,p)=>idx.set(p,n));
  const res=(c,ref)=>{for(let k=c.length;k>=0;k--){const p=c.slice(0,k).concat(ref.split('.')).join('.');if(idx.has(p))return p}return ref};
  M.rels.forEach(r=>{r.from=res(r.c,r.from);r.to=res(r.c,r.to)});

function walk(list,pre,f,par){list.forEach((n,i)=>{const p=pre?pre+'.'+n.id:n.id;n._p=p;f(n,p,par,list,i);walk(n.children,p,f,n)})}

function viewsAdjust(vs,idx,M){
  if(!vs)return vs;
  const open=vs.indexOf('{'),close=vs.lastIndexOf('}');
  const head=vs.slice(0,open+1),tail=vs.slice(close);const body=vs.slice(open+1,close);
  const re=/view\s+(\w+)(?:\s+of\s+([\w.]+))?\s*\{/g;let m,pos=0;const parts=[];
  while((m=re.exec(body))){const bo=m.index+m[0].length-1,bc=matchBrace(body,bo);
    parts.push({pre:body.slice(pos,m.index),text:body.slice(m.index,bc+1),id:m[1],of:m[2]});pos=bc+1;re.lastIndex=bc+1}
  const rest=body.slice(pos);
  let keep=parts.filter(p=>!p.of||idx.has(p.of));
  const roots=M.nodes.filter(n=>n.children.length&&!isStep(n));
  const nsteps=n=>n.children.reduce((a,c)=>a+(isStep(c)?1:0)+nsteps(c),0);
  keep.forEach(p=>{
    roots.forEach(R=>{
      if(new RegExp('include\\s+'+R.id+'\\.\\*\\*').test(p.text)){
        const ex=R.children.map(c=>R.id+'.'+c.id).join(', ');
        if(/^\s*exclude [^\n]*$/m.test(p.text))p.text=ex?p.text.replace(/^(\s*)exclude [^\n]*$/m,'$1exclude '+ex):p.text.replace(/\n\s*exclude [^\n]*/,'');
        else if(ex)p.text=p.text.replace(/^(\s*)(include [^\n]*)$/m,'$1$2\n$1exclude '+ex)}});
    if(p.id==='roles'){const c=(M.nodes.find(n=>n.id==='company')||{children:[]}).children.length;p.text=p.text.replace(/[۰-۹]+ نقش؛/,toFa(c)+' نقش؛')}
    if(p.id==='hiringAll'){const hr=M.nodes.find(n=>n.id==='hiring');if(hr)p.text=p.text.replace(/همهٔ [۰-۹]+ قدم/,'همهٔ '+toFa(nsteps(hr))+' قدم')}});
  const has=new Set(keep.map(p=>p.of).filter(Boolean));
  const add=(id,of,title)=>{if(!has.has(of)&&idx.has(of))keep.push({pre:'\n\n  ',text:`view ${id} of ${of} {\n    title ${q(title)}\n    include *\n  }`,id,of})};
  const num=id=>(id.match(/\d+/)||[id])[0];
  M.nodes.forEach(R=>R.children.forEach(c=>{
    const p=R.id+'.'+c.id,name=c.title.replace(/^(🔒|🔓)\s*/,'').replace(/^\d+ · /,'').replace(/\s*🔒$/,'');
    if(c.kind==='role')add('v'+num(c.id),p,num(c.id)+' · '+name);
    else if(c.kind==='section')add('hsec'+num(c.id),p,num(c.id)+' · '+name);
    else if(c.kind==='project')add('vp_'+c.id,p,name)}));
  return head+keep.map(p=>p.pre+p.text).join('')+rest+tail}
function emitC4(M){
  const idx=new Map();walk(M.nodes,'',(n,p)=>idx.set(p,n));
  const byC=new Map();M.rels.forEach(r=>{const k=r.c.join('.');if(!byC.has(k))byC.set(k,[]);byC.get(k).push(r)});
  const ref=(a,c)=>{const s=a.split('.');return(c.length&&c.every((x,i)=>s[i]===x)&&s.length>c.length)?s.slice(c.length).join('.'):a};
  const body=(list,d,cp,node)=>{const I='  '.repeat(d),L=[];
    if(node){node.tags.forEach(t=>L.push(I+'#'+t));
      if(node.icon)L.push(`${I}icon ${node.icon}`);
      if(node.tech)L.push(`${I}technology ${q(node.tech)}`);
      if(node.desc)L.push(`${I}description ${q(node.desc)}`);
      if(node.meta&&node.meta.length){L.push(I+'metadata {');node.meta.forEach(([k,v])=>L.push(`${I}  ${k} ${q(v)}`));L.push(I+'}')}}
    list.forEach(ch=>{const gap=ch.gap!==undefined?ch.gap:BLOCK.has(ch.kind);if(gap&&L.length)L.push('');L.push(...elem(ch,d,cp.concat(ch.id)))});
    (byC.get(cp.join('.'))||[]).forEach((r,i)=>{const gap=r.gap!==undefined?r.gap:(i===0&&list.length&&BLOCK.has(list[list.length-1].kind));
      if(gap&&L.length)L.push('');L.push(`${I}${ref(r.from,cp)} -> ${ref(r.to,cp)}${r.label?' '+q(r.label):''}`)});
    return L};
  const elem=(n,d,cp)=>{const I='  '.repeat(d),hd=`${I}${n.id} = ${n.kind} ${q(n.title)}`,b=body(n.children,d+1,cp,n);return b.length?[hd+' {',...b,I+'}']:[hd]};
  // شمارنده‌های متنیِ توضیحات
  const co=M.nodes.find(n=>n.id==='company'),hi=M.nodes.find(n=>n.id==='hiring');
  const backup=[];const fix=(n,re,v)=>{if(n&&n.desc&&re.test(n.desc)){backup.push([n,n.desc]);n.desc=n.desc.replace(re,v)}};
  if(co)fix(co,/^[۰-۹]+ نقش/,toFa(co.children.length)+' نقش');
  if(hi)fix(hi,/^[۰-۹]+ بخش/,toFa(hi.children.length)+' بخش');
  const lines=body(M.nodes,1,[],null);
  backup.forEach(([n,d])=>n.desc=d);
  let pre=M.pre;
  const hasKind=k=>[...idx.values()].some(n=>n.kind===k);
  if((hasKind('project')||hasKind('tool'))&&!/element project/.test(pre)){
    pre=pre.replace(/^(\s*tag locked)/m,`  element project {\n    notation "پروژهٔ قابل‌فراخوانی — Claude MCP + OpenAI/REST"\n    style {\n      color sky\n      shape component\n    }\n  }\n  element tool {\n    notation "ابزار پروژه — با #gated = پشت تأیید انسانی"\n    style {\n      color secondary\n    }\n  }\n$1`);
    if(!/tag gated/.test(pre))pre=pre.replace(/^(\s*tag unknownSkill)/m,'$1\n  tag gated')}
  return pre+'model {\n'+lines.join('\n')+'\n}'+M.mid+viewsAdjust(M.views,idx,M)}

    [none||/^https?:\/\/(127\.0\.0\.1|localhost)/.test(meta(n,'local_url')),'حالت لوکال: 127.0.0.1 بدون کلید'],
    [none||/^https:\/\//.test(meta(n,'public_url')),'حالت عمومی: آدرس HTTPS'],

/* ───────── خروجی ───────── */
const ys=v=>/^[\w./:@+\-]+$/.test(v)&&!/^(true|false|null|yes|no|\d)/i.test(v)?v:JSON.stringify(v);
function capsYaml(){
  const o=['# capabilities.yaml — تولیدشده از استودیوی سازمان ('+new Date().toISOString().slice(0,10)+')','# فقط نام متغیر محیطی؛ هرگز مقدار کلید','# UNKNOWN = هنوز معلوم نیست (حدس نزن؛ در HISTORY.md «باز» ثبت کن)'];
  IDX.forEach((n,p)=>{if(n.kind!=='project')return;
    const tools=n.children.filter(c=>c.kind==='tool'),pr=meta(n,'protocol');
    o.push(`- task: ${JSON.stringify(titleName(n))}`,`  project: ${n.id}`,`  status: ${meta(n,'status')}`,`  protocol: ${pr}`);
    if(pr==='none')o.push(`  exempt_reason: ${JSON.stringify(meta(n,'exempt_reason')||'UNKNOWN')}`);
    else{o.push(`  consumers: [${[/mcp/.test(pr)||'claude-mcp-planned',/rest/.test(pr)||'openai-rest-planned'].map((x,i)=>x===true?['claude-mcp','openai-rest'][i]:x).join(', ')}]${meta(n,'a2a')==='yes'?'  # + a2a':''}`,
      '  modes:',`    local:  {base_url: ${ys(meta(n,'local_url')||'UNKNOWN')}, auth: none}`,
      `    public: {base_url: ${ys(meta(n,'public_url')||'UNKNOWN')}, auth: {type: api_key, env: ${ys(meta(n,'auth_env')||'UNKNOWN')}}, rate_limit: ${ys(meta(n,'rate_limit')||'UNKNOWN')}}`,
      `  async: ${meta(n,'async')||'none'}`)}
    o.push(`  needs_human_gate: ${tools.some(t=>t.tags.includes('gated'))}`);
    o.push('  tools:');tools.forEach(t=>{const ti=toolInfo(t);o.push(`    - {name: ${t.id}, access: ${ti.acc}, category: ${ti.cat||'null'}}`)});
    if(!tools.length)o[o.length-1]='  tools: []'});
  return o.join('\n')+'\n'}
function gatesYaml(){
  const o=['# interop/gates.yaml (نسخه 1) — تولیدشده از استودیوی سازمان','# هر ویرایش این فهرست را در HISTORY.md با تاریخ و دلیل ثبت کن','version: 1','default_policy: require_approval        # ابزار بدون ردیف = پشت تأیید','categories:'];
  CATS.forEach(c=>o.push(`  ${(c+':').padEnd(14)}{gate: ${!!G.cats[c]}, examples: [${CATEX[c].join(', ')}]}`));
  o.push('tools:');let any=false;
  IDX.forEach(n=>{if(n.kind==='tool'){any=true;const c=toolInfo(n).cat;o.push(`  ${n.id}: ${c||'# بدون دسته ⇒ پشت تأیید'}`)}});
  if(!any)o[o.length-1]='tools: {}';
  o.push('approval:','  channel: out_of_band','  expires_hours: '+G.expires,'overrides: []');
  return o.join('\n')+'\n'}
function flat(Mx){const m=new Map(),r=new Set();walk(Mx.nodes,'',(n,p)=>m.set(p,JSON.stringify({k:n.kind,t:n.title,g:[...n.tags].sort(),i:n.icon||'',te:n.tech||'',d:n.desc||'',m:n.meta||[]})));Mx.rels.forEach(x=>r.add(`${x.from} → ${x.to} «${x.label||''}»`));return{m,r}}
function diff(){
  const a=flat(BASEPARSE),b=flat(M),out={add:[],del:[],mod:[],radd:[],rdel:[],lock:[]};
  b.m.forEach((v,p)=>{if(!a.m.has(p))out.add.push(p);else if(a.m.get(p)!==v)out.mod.push(p)});
  a.m.forEach((v,p)=>{if(!b.m.has(p))out.del.push(p)});
  b.r.forEach(x=>{if(!a.r.has(x))out.radd.push(x)});a.r.forEach(x=>{if(!b.r.has(x))out.rdel.push(x)});
  walk(BASEPARSE.nodes,'',(n,p)=>{if(!lockedN(n))return;const c=IDX.get(p);
    if(!c)out.lock.push(`🗑 «${n.title}» (${p}) قفل‌شده بود و حذف شد`);
    else if(!lockedN(c))out.lock.push(`🔓 قفل «${n.title}» (${p}) برداشته شد`);
    else if(a.m.get(p)!==b.m.get(p))out.lock.push(`⚠ «${n.title}» (${p}) قفل است ولی محتوایش فرق دارد`)});
  return out}
let OUTTAB='c4';
function renderOut(){
  const root=$('#p-out');root.replaceChildren();
  const text=cur();
  let rt;try{const M2=parseC4(text);rt=emitC4(M2)===text}catch(e){rt=false}
  let brt;try{brt=emitC4(parseC4(BASETEXT))===BASETEXT}catch(e){brt=false}
  const d=diff();
  const li=(arr,pre)=>arr.map(x=>h('li',{},pre+' ',h('span',{class:'ltr'},x)));
  root.append(h('div',{class:'panel',style:'margin-bottom:12px'},h('h2',{},'تغییرات نسبت به نسخهٔ پایه'),
    d.lock.length?h('div',{class:'lockbox'},h('b',{},'قفل‌ها:'),h('ul',{class:'diffs'},d.lock.map(x=>h('li',{},x)))):h('small',{},'🔒 هیچ مورد قفل‌شده‌ای تغییر نکرده.'),
    h('ul',{class:'diffs'},li(d.add,'➕'),li(d.mod,'✏️'),li(d.del,'🗑'),li(d.radd,'🔗➕'),li(d.rdel,'🔗🗑')),
    (d.add.length+d.mod.length+d.del.length+d.radd.length+d.rdel.length)?null:h('small',{},'بدون تغییر — خروجی با نسخهٔ پایه یکی است.'),
    h('div',{class:'row',style:'margin-top:6px'},h('span',{class:'badge '+(rt?'ok':'red')},rt?'خودآزمون: خروجی دوباره تجزیه می‌شود و یکسان است ✓':'خودآزمون ناموفق ✗'),
      h('span',{class:'badge '+(brt?'ok':'red')},brt?'فایل پایه بی‌تغییر بازتولید می‌شود ✓':'فایل پایه عیناً بازتولید نمی‌شود (قالب خاص/کامنت داخل model؟) — خروجی را با diff بررسی کن'))));

  const tabs=h('div',{class:'row'},Object.entries({c4:'recruitment.c4 (کامل)',caps:'capabilities.yaml',gates:'interop/gates.yaml'}).map(([k,l])=>h('button',{class:OUTTAB===k?'pri':'',onclick:()=>{OUTTAB=k;renderOut()}},l)));
  const [name,body]=files[OUTTAB];
  root.append(h('div',{class:'panel'},tabs,h('div',{class:'row',style:'margin:8px 0'},
    h('button',{class:'pri',onclick:async e=>{try{await navigator.clipboard.writeText(body);e.target.textContent='کپی شد ✓'}catch(x){const t=$('#outpre');const r=document.createRange();r.selectNodeContents(t);getSelection().removeAllRanges();getSelection().addRange(r);e.target.textContent='انتخاب شد؛ Ctrl+C'}}},'کپی متن کامل'),
    h('small',{},OUTTAB==='c4'?'این متن را جایگزین c4-org/recruitment.c4 کن (کل فایل).':'برای پروژه‌ها؛ در پوشهٔ interop/ یا دفتر مرکزی بگذار.')),
    h('pre',{id:'outpre'},body)))}

const TABS=[['dia','فلوچارت سازمان'],['int','پروژه‌ها و interop'],['out','تغییرات و خروجی C4']];
function showTab(){
  $('#p-dia').hidden=TAB!=='dia';$('#p-int').hidden=TAB!=='int';$('#p-out').hidden=TAB!=='out';

$('#undo').onclick=undo;
$('#reset').onclick=async()=>{if(await ask('همهٔ تغییرات پاک شود و نمونهٔ مخزن برگردد؟')){G={};loadText(BASE,true);save();NEEDFIT=true;refresh()}};
$('#load').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;const t=await f.text();
  try{G={};loadText(t,true);save();NEEDFIT=true;refresh()}catch(x){await ask('فایل خوانده نشد: '+x.message,{info:1})}e.target.value=''};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();undo()}});

(function init(){
  let st=null;try{st=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  try{
    if(st&&st.cur&&st.base){G=st.G||{};BASETEXT=st.base;BASEPARSE=parseC4(BASETEXT);M=parseC4(st.cur);reindex();deriveG();G=st.G&&st.G.cats?Object.assign(G,{expires:st.G.expires||24}):G;HIST=[st.cur]}
    else loadText(BASE,true)
  }catch(e){G={};loadText(BASE,true)}
  $('#cvhint').textContent=HINT;renderVers();showTab()})();
window.__studio={parseC4,emitC4,get M(){return M},get BASE(){return BASE},cur,diff,addChild,IDX:()=>IDX,select,setLock,loadText};
