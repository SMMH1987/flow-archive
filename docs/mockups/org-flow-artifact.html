<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<style>

  --ask:#f0b030;--askbg:#3a2f12;--auto:#58c27a;--autobg:#16301f;--gate:#ff6b6e;--gatebg:#3d1a1c;--route:#8f99ff;--routebg:#22264a;
  --proj:#4cc2d6;--projbg:#14313a;--edge:#6f7d90;--e-seq:#8ea0b8;--e-in:#5aa2ff;--e-out:#4fd28a;--e-back:#ffa63d;--e-route:#ee74c8;--e-x:#e0b24a;--warnbg:#3a3118;color-scheme:dark}}

  --ask:#f0b030;--askbg:#3a2f12;--auto:#58c27a;--autobg:#16301f;--gate:#ff6b6e;--gatebg:#3d1a1c;--route:#8f99ff;--routebg:#22264a;

.side{position:sticky;top:8px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 30px);overflow:auto}

#insp .panel.shut > :not(.acch){display:none!important}
#insp .qm{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--mute);font-size:11px;padding:0;line-height:1}
#insp .acchelp{display:block;background:var(--lane);border-radius:8px;padding:8px 10px;margin:0 0 8px;font-size:11.5px;line-height:1.7}
#insp .acchelp[hidden]{display:none}
#tree .trq{width:calc(100% - 16px);margin:8px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--lane);font:inherit;font-size:12.5px;color:var(--ink)}
#tree .tr{border-radius:6px;padding:5px 8px;margin:1px 6px;font-size:12.5px;cursor:pointer}#tree .tr:hover{background:var(--lane)}
#tree .tr.cur{background:color-mix(in srgb,#ea4b71 12%,transparent);color:#ea4b71;font-weight:700}
#tree .tr[hidden]{display:none}
</style>
<div id="app">
  <div class="top">
    <h1>استودیوی سازمان <small>— فلوچارت زنده؛ ویرایش کن، خروجی = متن کامل <span class="ltr" id="doc-name">recruitment.c4</span></small></h1>
    <nav class="tabs" id="tabs"></nav>
    <span class="vers" id="vers"></span>
    <button id="undo" title="برگشت (Ctrl+Z)">↶ برگشت</button>
    <button id="load">بارگذاری فایل <span class="ltr">.c4</span></button>

<script type="text/plain" id="base-c4">// نمونهٔ «سازمان کامل از یک ایده» — ایده: اتوماسیون کامل استخدام — 2026-11-06
// هر بخش = یک نقش سازمانی · هر قدم: technology = skill · description = out · آیکون = وضعیت قفل
// 🔒 = قفل (فقط با تأیید تو) · 🔓 = باز · tag designed = بخش ناشناخته که از ترکیب skillها طراحی شد
// رنگ قدم = نوع after: ask نارنجی · auto سبز · gate قرمز · route بنفش

specification {
  element actor {
    style {
      shape person
      color secondary
    }
  }
  element orgBox {
    style {
      color slate
    }
  }
  element role {
    style {
      color muted
    }
  }
  element askStep {
    notation "after: ask — خروجی را نشان بده و نظر بگیر"
    style {
      color amber
    }
  }
  element autoStep {
    notation "after: auto — خودکار برو قدم بعد"
    style {
      color green
    }
  }
  element gateStep {
    notation "after: gate — بایست تا کاربر تأیید کند"
    style {
      color red
    }
  }
  element routeStep {
    notation "after: route — شاخه را از روی نتیجه انتخاب کن"
    style {
      color indigo
      shape queue
    }
  }
  element flow {
    style {
      color slate
    }
  }
  element section {
    style {
      color muted
    }
  }
  element project {
    notation "پروژهٔ قابل‌فراخوانی — Claude MCP + OpenAI/REST"
    style {
      color sky
      shape component
    }
  }
  element tool {
    notation "ابزار پروژه — با #gated = پشت تأیید انسانی"
    style {
      color secondary
    }
  }
  tag locked
  tag designed
  tag unknownSkill
  tag gated
}

model {
  owner = actor 'مدیر / کارفرما' {
    description 'ایده می‌دهد · در دروازه‌ها تأیید می‌کند · قفل را او می‌زند'
  }
  candidate = actor 'کاندیدا' {
    description 'آگهی را می‌بیند · پرسشنامه پر می‌کند · مصاحبه می‌دهد'
  }

  company = orgBox 'سازمان اتوماسیون استخدام' {
    description '۹ نقش · هر قدم با skill خودش · بخش ناشناخته از skill طراحی شده'

    r1 = role '🔓 1 · استراتژیست استخدام' {
      icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/compass.svg
      goal = askStep 'هدف و نقش' {
        icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/unlock.svg
        technology 'skill: identify-assumptions-new'
        description 'out: نقش + تعداد + بودجه + فرض‌های پرخطر'
      }
      spec = askStep 'شرح شغل و معیار موفقیت' {
        icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/unlock.svg
        technology 'skill: first-principles'
        description 'out: وظایف + مهارت‌های ضروری + معیار ۹۰ روز'
      }
    }

    r2 = role '🔓 2 · نویسندهٔ آگهی و برند کارفرما' {
      icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/pencil-square.svg
      ad = autoStep 'طراحی آگهی' {
        icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/unlock.svg
        technology 'skill: marketing-skills:copywriting'
        description 'out: متن آگهی + ۳ تیتر + CTA'
      }
      brand = autoStep 'لحن و هویت کارفرما' {
        icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/unlock.svg
        technology 'skill: ui-brand'
        description 'out: لحن + ۳ جمله دربارهٔ فرهنگ سازمان'
      }
    }

    r3 = role '🔓 3 · مدیر انتشار و جذب' {
      icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/megaphone.svg
      post = gateStep 'انتشار آگهی' {
        icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/unlock.svg
        technology 'skill: marketing-skills:social'
        description 'out: پیش‌نویس برای هر کانال؛ انتشار فقط بعد از تأیید'
      }
      track = autoStep 'ردیابی منبع رزومه' {
        icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/unlock.svg
        technology 'skill: marketing-skills:analytics'
        description 'out: هر کانال چند رزومه آورد'
      }
    }

    r4 = role '🔓 4 · طراح پرسشنامهٔ پویا (بخش طراحی‌شده)' {
      #designed
      icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/ui-checks.svg
      derive = autoStep 'استخراج سؤال از آگهی' {
        icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/unlock.svg
        technology 'skill: grilling + fp-qmark-to-robot (ترکیب)'
        description 'out: بانک سؤال برای هر مهارتِ آگهی + وزن'
      }
      branch = routeStep 'پاسخ ضعیف است؟' {
        icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/unlock.svg
        technology 'after: route'
        description 'ضعیف ← سؤال عمیق‌تر · قوی ← مهارت بعدی'
      }
      form = autoStep 'ساخت فرم تعاملی' {
        icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/unlock.svg
        technology 'skill: agent-skills:frontend-ui-engineering'
        description 'out: فرم HTML با منطق شرطی (۴ زیرقدم داخلش)'
        f1 = autoStep 'ساخت اسکلت فرم' {
          icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/unlock.svg
          technology 'skill: agent-skills:frontend-ui-engineering'
        }
        f2 = autoStep 'منطق شرطی سؤال‌ها' {
          icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/unlock.svg
          technology 'skill: fp-qmark-to-robot'
        }
        f3 = askStep 'پیش‌نمایش و تأیید' {
          icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/unlock.svg
          technology 'skill: ui-before-after'
        }
        f4 = autoStep 'ذخیرهٔ پاسخ‌ها' {
          icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/unlock.svg
          technology 'skill: —'
        }
        f1 -> f2 'بعد'
        f2 -> f3 'بعد'
        f3 -> f4 'تأیید'
      }
    }

    r5 = role '🔓 5 · تحلیل‌گر غربال' {
      icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/funnel.svg
      score = autoStep 'امتیازدهی رزومه + پرسشنامه' {
        icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/unlock.svg
        technology 'skill: analytics-office:explore-my-data'
        description 'out: امتیاز ۰ تا ۱۰ + دلیل برای هر نفر'
      }
      d1 = routeStep 'امتیاز ۷+ دارد؟' {
        icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/unlock.svg
        technology 'after: route'
      }
      reject = gateStep 'پیام رد مؤدبانه' {
        icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/unlock.svg
        technology 'skill: marketing-skills:copywriting'
        description 'out: پیش‌نویس پیام، بدون ارسال خودکار'
      }
    }

    r6 = role '🔓 6 · مصاحبه‌گر' {
      icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/chat-dots.svg
      qs = autoStep 'سؤال‌های مصاحبه' {
        icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/unlock.svg
        technology 'skill: grilling'
        description 'out: ۱۰ سؤال + یک سناریوی عملی'
      }
      iv = askStep 'مصاحبه و ثبت نمره' {
        icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/unlock.svg
        technology 'skill: —'
        description 'out: نمرهٔ هر سؤال از تو'
      }
      d2 = routeStep 'قبول شد؟' {
        icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/unlock.svg
        technology 'after: route'
      }
    }

    r7 = role '🔓 7 · ارزیاب KPI' {
      icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/graph-up.svg
      kpi = askStep 'تعریف KPI نقش' {
        icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/unlock.svg
        technology 'skill: analytics-office:kpi-contract'
        description 'out: ۳ KPI + فرمول + منبع داده + بازهٔ بازبینی'
      }
      board = autoStep 'داشبورد ارزیابی' {
        icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/unlock.svg
        technology 'skill: analytics-office:review-my-dashboard'
        description 'out: نمای نمره‌ها + روند ۳۰/۶۰/۹۰ روز'
      }
    }

    r8 = role '🔒 8 · حقوقی و آنبوردینگ' {
      #locked
      icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/shield-lock.svg
      offer = gateStep 'قرارداد' {
        #locked
        icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/lock-fill.svg
        technology 'skill: anthropic-skills:docx'
        description 'out: قرارداد.docx با شرایط مرحلهٔ ۱ (قفل از فلوی قبلی)'
      }
      accept = gateStep 'پیشنهاد پذیرفته شد؟' {
        #locked
        icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/lock-fill.svg
        technology 'after: gate'
      }
      onboard = askStep 'برنامهٔ ورود (ناشناخته — skill پیشنهادی منتظر «بله»)' {
        #unknownSkill
        icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/unlock.svg
        technology 'skill پیشنهادی: marketing-skills:onboarding'
        description 'out: چک‌لیست هفتهٔ اول + دسترسی‌ها + معرفی تیم'
      }
    }

    r9 = role '🔓 9 · مسیریاب پروژه‌ها (ارجاع به پروژه‌های خودت)' {
      #designed
      icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/diagram-3.svg
      reg = askStep 'دفتر ظرفیت پروژه‌ها' {
        icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/unlock.svg
        technology 'فایل: capabilities.yaml — هر پروژه چه کاری می‌کند و از کجا صدا زده می‌شود'
        description 'out: جدول «کار ← پروژه ← آدرس ← احراز هویت»'
      }
      legal = gateStep 'سؤال حقوقی / طراحی قرارداد ← ایجنت وکیل حق‌پرس' {
        #unknownSkill
        icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/unlock.svg
        technology 'project: حق‌پرس (آدرس و پروتکل نامشخص — ask)'
        description 'out: پاسخ حقوقی + پیش‌نویس قرارداد؛ ورود به قرارداد فقط با تأیید تو'
      }
      stt = autoStep 'تبدیل گفتار به متن ← API آوانگار (همدبیر)' {
        icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/unlock.svg
        technology 'api: api.hamdabir.co-ir.com:8440 · کلید avn_live از .env · callback با امضای whsec_'
        description 'out: متن مصاحبه/صدا + هزینهٔ کسرشده از کیف پول'
      }
      miss = routeStep 'کاری که در دفتر نیست؟' {
        icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/unlock.svg
        technology 'after: route'
        description 'نیست ← find-skills + تحقیق، بعد ثبت در دفتر'
      }
    }

    r1.goal -> r1.spec 'بعد'
    r1.spec -> r2.ad 'بعد'
    r2.brand -> r2.ad 'لحن'
    r2.ad -> r3.post 'بعد'
    r3.post -> r4.derive 'منتشر شد'
    r3.post -> r3.track 'پایش'
    r4.derive -> r4.branch 'بعد'
    r4.branch -> r4.derive 'ضعیف'
    r4.branch -> r4.form 'کافی'
    r4.form -> r5.score 'پاسخ‌ها'
    r5.score -> r5.d1 'بعد'
    r5.d1 -> r6.qs 'بله'
    r5.d1 -> r5.reject 'نه'
    r5.d1 -> r2.ad 'هیچ‌کس'
    r6.qs -> r6.iv 'بعد'
    r6.iv -> r6.d2 'بعد'
    r6.d2 -> r8.offer 'قبول'
    r6.d2 -> r5.reject 'رد'
    r8.offer -> r8.accept 'بعد'
    r8.accept -> r8.onboard 'بله'
    r8.accept -> r5.score 'نه'
    r8.onboard -> r7.kpi 'شروع کار'
    r7.kpi -> r7.board 'بعد'
    r9.reg -> r9.legal 'کار حقوقی'
    r9.reg -> r9.stt 'کار صوتی'
    r9.reg -> r9.miss 'کار تازه'
    r9.legal -> r8.offer 'پیش‌نویس قرارداد'
    r6.iv -> r9.stt 'ضبط مصاحبه'
  }

  hiring = flow 'استخدام فروشندهٔ درصدی' {
    description '۶ بخش · هر قدم با skill خودش · find-skills پیشنهاد می‌دهد، کاربر تأیید می‌کند'

    s1 = section '1 · تعریف نقش' {
      goal = askStep 'هدف: استخدام فروشندهٔ درصدی برای {{product}}' {
        technology 'skill: —'
        description 'out: محصول + بازار + تعداد نفر'
      }
      role = askStep 'شرح شغل و مدل پورسانت' {
        technology 'skill: first-principles'
        description 'out: وظایف + درصد پورسانت + سقف + دورهٔ پرداخت'
      }
    }

    s2 = section '2 · جذب' {
      ad = autoStep 'آگهی استخدام' {
        technology 'skill: marketing-skills:copywriting'
        description 'out: متن آگهی + ۳ تیتر'
      }
      post = gateStep 'انتشار آگهی' {
        technology 'skill: marketing-skills:social'
        description 'out: پیش‌نویس پست در ۲ کانال، بدون انتشار خودکار'
      }
    }

    s3 = section '3 · غربال' {
      screen = autoStep 'غربال رزومه‌ها' {
        technology 'skill: —'
        description 'out: امتیاز ۰ تا ۱۰ برای هر نفر + دلیل'
      }
      d1 = routeStep 'کسی امتیاز ۷+ دارد؟' {
        technology 'after: route'
      }
      reject = gateStep 'پیام رد مؤدبانه' {
        technology 'skill: marketing-skills:copywriting'
        description 'out: پیش‌نویس پیام، بدون ارسال خودکار'
      }
    }

    s4 = section '4 · مصاحبه' {
      qs = autoStep 'سؤال‌ها + نقش‌آفرینی فروش' {
        technology 'skill: grilling'
        description 'out: ۱۰ سؤال + یک سناریوی فروش تلفنی'
      }
      iv = askStep 'مصاحبه و ثبت نمره' {
        technology 'skill: —'
        description 'out: نمرهٔ هر سؤال از کاربر'
      }
      d2 = routeStep 'قبول شد؟' {
        technology 'after: route'
      }
    }

    s5 = section '5 · قرارداد 🔒' {
      #locked
      offer = gateStep 'قرارداد درصدی' {
        #locked
        technology 'skill: anthropic-skills:docx'
        description 'out: قرارداد.docx با درصد و شرایط مرحلهٔ ۱'
      }
      d3 = gateStep 'پیشنهاد را پذیرفت؟' {
        technology 'after: gate'
      }
    }

    s6 = section '6 · شروع کار' {
      kit = autoStep 'کیت فروش و آموزش' {
        technology 'skill: marketing-skills:sales-enablement'
        description 'out: اسکریپت فروش + پاسخ به اعتراض‌ها'
      }
      kpi = askStep 'هدف ۳۰ روز اول' {
        technology 'skill: —'
        description 'out: تعداد فروش + نرخ تبدیل + زمان بازبینی'
      }
    }

    s1.goal -> s1.role 'بعد'
    s1.role -> s2.ad 'بعد'
    s2.ad -> s2.post 'بعد'
    s2.post -> s3.screen 'تأیید شد'
    s3.screen -> s3.d1 'بعد'
    s3.d1 -> s4.qs 'بله'
    s3.d1 -> s2.ad 'هیچ‌کس'
    s4.qs -> s4.iv 'بعد'
    s4.iv -> s4.d2 'بعد'
    s4.d2 -> s5.offer 'قبول'
    s4.d2 -> s3.reject 'رد'
    s3.reject -> s3.screen 'نفر بعدی'
    s5.offer -> s5.d3 'بعد'
    s5.d3 -> s6.kit 'بله'
    s5.d3 -> s3.screen 'نه'
    s6.kit -> s6.kpi 'بعد'
  }

  projects = orgBox 'پروژه‌های قابل‌فراخوانی (interop)' {
    description 'هر پروژه: Claude MCP + OpenAI/REST · لوکال + عمومی · پرخطر ← تأیید انسانی (استاندارد v1)'

    hagh = project 'حق‌پرس — ایجنت وکیل' {
      icon https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/bank.svg
      technology 'rest+mcp · planned'
      description 'سؤال حقوقی و پیش‌نویس قرارداد؛ ورود به قرارداد فقط با تأیید تو'
      metadata {
        protocol 'rest+mcp'
        status 'planned'
        local_url 'http://127.0.0.1:8100'
        public_url 'UNKNOWN'
        auth_env 'UNKNOWN'
        rate_limit 'UNKNOWN'
        async 'poll'
      }
      vakil_case_start = tool 'شروع پرونده' {
        technology 'write · read_or_draft'
        description 'case_id برای ۷۲ ساعت معتبر است'
      }

/* ───────── تجزیه ───────── */
function matchBrace(s,open){let d=0;for(let i=open;i<s.length;i++){const c=s[i];

  if(c==='/'&&s[i+1]==='/'&&(i===0||/\s/.test(s[i-1]))){while(i<s.length&&s[i]!=='\n')i++;continue}

    if(c==='-'&&s[i+1]==='>'){t.push({t:'->',nl});nl=0;i+=2;continue}
    if(c==='='){t.push({t:'=',nl});nl=0;i++;continue}
    let j=i;while(j<s.length&&!/[\s{}'"=]/.test(s[j])&&!(s[j]==='-'&&s[j+1]==='>'))j++;

function parseItems(tk,st,cpath){

  while(st.p<tk.length&&tk[st.p].t!=='}'){
    const k=tk[st.p],nx=tk[st.p+1];

      if(tk[st.p]&&tk[st.p].t==='{'){st.p++;Object.assign(n,parseItems(tk,st,cpath.concat(n.id)));st.p++}

    else if(k.v==='description'&&nx){o.desc=nx.v;st.p+=2}
    else if(k.v==='metadata'&&nx&&nx.t==='{'){st.p+=2;o.meta=[];
      while(tk[st.p]&&tk[st.p].t!=='}'){o.meta.push([tk[st.p].v,tk[st.p+1].v]);st.p+=2}st.p++}

function parseC4(text){
  text=text.replace(/\r\n/g,'\n');
  const mi=text.search(/^model\s*\{/m);if(mi<0)throw new Error('بلوک model پیدا نشد');
  const mo=text.indexOf('{',mi),mc=matchBrace(text,mo);

  const root=parseItems(tokenize(text.slice(mo+1,mc)),st,[]);
  const M={pre:text.slice(0,mi),mid:text.slice(mc+1,vi<0?text.length:vi),views:vi<0?'':text.slice(vi),nodes:root.children,rels:st.rels};
  const idx=new Map();walk(M.nodes,'',(n,p)=>idx.set(p,n));
  const res=(c,ref)=>{for(let k=c.length;k>=0;k--){const p=c.slice(0,k).concat(ref.split('.')).join('.');if(idx.has(p))return p}return ref};

function walk(list,pre,f,par){list.forEach((n,i)=>{const p=pre?pre+'.'+n.id:n.id;n._p=p;f(n,p,par,list,i);walk(n.children,p,f,n)})}

/* ───────── ساخت متن ───────── */
function viewsAdjust(vs,idx,M){

  const head=vs.slice(0,open+1),tail=vs.slice(close);const body=vs.slice(open+1,close);
  const re=/view\s+(\w+)(?:\s+of\s+([\w.]+))?\s*\{/g;let m,pos=0;const parts=[];
  while((m=re.exec(body))){const bo=m.index+m[0].length-1,bc=matchBrace(body,bo);
    parts.push({pre:body.slice(pos,m.index),text:body.slice(m.index,bc+1),id:m[1],of:m[2]});pos=bc+1;re.lastIndex=bc+1}

  let keep=parts.filter(p=>!p.of||idx.has(p.of));
  const roots=M.nodes.filter(n=>n.children.length&&!isStep(n));

function emitC4(M){

function fit(all){if(!LAST)return;const cv=$('#cv'),w=cv.clientWidth,hh=cv.clientHeight;if(!w)return;
  const kw=w/(LAST.W+30),k=all===true?Math.min(kw,hh/(LAST.H+30)):all==='ov'?Math.max(Math.min(kw,hh/(LAST.H+30)),.62):Math.min(kw,1.05);VIEW.k=Math.max(.2,k);VIEW.x=(w-LAST.W*VIEW.k)/2;VIEW.y=8;

function relStyle(r,i,back,x){

  let adj=false;

    if(fi&&!ti){col='--e-out';adj=true}else if(ti&&!fi){col='--e-in';adj=true}else if(fi&&ti)adj=true}
  return{col:e?'--acc':col,thick:adj||e,dim:(!!SEL||SELE!=null)&&!(adj||e)}}
function drawEdge(svg,d,o){
  let{on,dim,dash,label,lx,ly,anchor,idx,col,back,x}=o,thick=on;
  if(!col&&idx!=null&&M.rels[idx]){const st=relStyle(M.rels[idx],idx,back,x);col=st.col;thick=st.thick;dim=st.dim}

  if(idx!=null&&M.rels[idx]){const r0=M.rels[idx],tt=sv('title');tt.textContent='از «'+nodeLabel(r0.from)+'» به «'+nodeLabel(r0.to)+'»'+(r0.label?' — '+r0.label:'');hit.append(tt)}
  svg.append(hit);
  if(label){const t=sv('text',{x:lx,y:ly,'font-size':12.5,'text-anchor':anchor||'middle',style:`fill:var(${col});paint-order:stroke;stroke:var(--bg);stroke-width:5px;font-family:var(--font);font-weight:600;opacity:${dim?.4:1}`});t.textContent=label;svg.append(t)}}

function linkKids(nd,pth,add){
  const ks=nd.children;

    if(k<ks.length-1){
      const prevRoute=k>0&&ks[k-1].kind==='routeStep',isR=c.kind==='routeStep';
      const br=(meta(c,'branches')||'بله|نه').split('|');

      else if(!prevRoute&&!(k>1&&ks[k-2].kind==='routeStep'))add(pth+'.'+c.id,pth+'.'+ks[k+1].id)}
    linkKids(c,pth+'.'+c.id,add)})}

    return `task_${s.id}:\n  description: ${q(titleName(s)+(must?' | باید: '+must:'')+(not?' | نباید: '+not:''))}\n  expected_output: ${q(outText(s)||'نامشخص')}\n  agent: ${a.key}`+(ctx.length?`\n  context: [${ctx.join(', ')}]`:'')+(s.kind==='gateStep'||s.kind==='askStep'?'\n  human_input: true':'')+(s.kind==='routeStep'?'\n  # تصمیم (route): در CrewAI با Flow و @router پیاده می‌شود':'')}).join('\n\n');
  const agents=[...ag.values()].map(a=>`${a.key}:\n  role: ${q(a.role)}\n  goal: ${q(a.goal||'(پر کن)')}\n  backstory: ${q(a.back||'(پر کن)')}`+(a.tools.size?`\n  # ابزار پیشنهادی: ${[...a.tools].join(', ')}`:'')).join('\n\n');

async function spliceStep(refP,dir,node){
  const pp=parentPath(refP),top=!pp,par=top?null:IDX.get(pp),ref=IDX.get(refP);
  if(!ref||(!top&&!par))return false;
  if(!top&&(lockedN(par)||lockedN(ref))){await ask('این قسمت قفل است؛ پیشنهاد روی آن اعمال نمی‌شود.',{info:1});return false}

  const chain=top?sib.filter(inChain):sib,ci=chain.indexOf(ref),nb=chain[dir==='after'?ci+1:ci-1],i=sib.indexOf(ref);
  node.id=uniqueId(sib,top?'m':'n');const newP=pre+node.id,nbP=nb?pre+nb.id:null;
  sib.splice(dir==='after'?i+1:i,0,node);
  const nbOk=nb&&!lockedN(nb);
  const old=nbOk?M.rels.find(r=>dir==='after'?(r.from===refP&&r.to===nbP):(r.from===nbP&&r.to===refP)):null;
  if(dir==='after'){

    if(old){const lab=old.label;old.to=newP;old.c=lca(nbP,newP);M.rels.push({from:newP,to:refP,label:lab||'بعد',c:lca(newP,refP)})}

/* چیدمان یک بخش (مشترک بین نمای کلی و جزئیات) */
function buildLane(lane,lp,o){
  const boxes=new Map(),order=[],frames=[];let y=o.y;
  lane.children.forEach(c=>{
    const p=lp+'.'+c.id,b={x:o.CX-o.CW/2,y,w:o.CW,h:o.NHH,n:c,p,outY:y+o.NHH};boxes.set(p,b);order.push(b);let by=y+o.NHH;
    if(c.children.length){let cy=y+o.NHH+o.fg;const cw=o.CW-o.ind;
      c.children.forEach(k=>{const kb={x:o.CX-cw/2,y:cy,w:cw,h:o.CHH,n:k,p:p+'.'+k.id,outY:cy+o.CHH,child:1};boxes.set(kb.p,kb);order.push(kb);cy+=o.CHH+o.cg});
      const fb=cy-o.cg+10;frames.push({x:b.x+4,y:y+o.NHH+6,w:o.CW-8,h:fb-(y+o.NHH+6)});b.outY=fb;by=fb}
    y=by+o.VG});
  return{boxes,order,frames,bottom:y-o.VG}}
function drawInternal(svg,boxes,order,compact){
  const list=[];M.rels.forEach((r,i)=>{const a=boxes.get(r.from),b=boxes.get(r.to);if(a&&b&&a!==b)list.push({r,i,a,b})});
  routeList(svg,list,order,compact?{base:12,stp:8,compact:1}:{base:62,stp:16})}
function routeList(svg,list,order,cfg){
  const R=[],Lf=[];
  const lab=(r,i)=>r.label&&(relStyle(r,i,false).thick||(IDX.get(r.from)||{}).kind==='routeStep');
  list.forEach(({r,i,a,b})=>{
    const between=order.some(x=>x!==a&&x!==b&&x.y>=a.outY&&x.y<b.y);
    if(b.y>=a.outY-1&&!between){const xa=(a.x+a.w/2+b.x+b.w/2)/2;drawEdge(svg,polyD([[xa,a.outY],[xa,b.y]]),{idx:i,label:r.label,lx:xa+8,ly:(a.outY+b.y)/2+4,anchor:'start'})}
    else if(b.y>a.y)R.push({r,i,a,b,span:b.y-a.y});else Lf.push({r,i,a,b,span:a.y-b.y})});
  const base=cfg.base,stp=cfg.stp;
  const assign=arr=>{arr.sort((p,q)=>p.span-q.span);const go=new Map(),gi=new Map();
    arr.forEach(e=>{if(!go.has(e.a))go.set(e.a,[]);go.get(e.a).push(e);if(!gi.has(e.b))gi.set(e.b,[]);gi.get(e.b).push(e)});
    go.forEach(l=>l.forEach((e,k)=>e.so=(k-(l.length-1)/2)*10));gi.forEach(l=>l.forEach((e,k)=>e.si=(k-(l.length-1)/2)*10))};
  assign(R);assign(Lf);
  R.forEach((e,k)=>{const off=base+stp*k,x1=e.a.x+e.a.w,x2=e.b.x+e.b.w,xm=Math.max(x1,x2)+off,y1=e.a.y+e.a.h/2+(e.so||0),y2=e.b.y+e.b.h/2+(e.si||0);
    drawEdge(svg,polyD([[x1,y1],[xm,y1],[xm,y2],[x2,y2]]),{idx:e.i,label:lab(e.r,e.i)?e.r.label:'',lx:x1+8,ly:y1-6,anchor:'start'})});
  Lf.forEach((e,k)=>{const off=base+stp*k,x1=e.a.x,x2=e.b.x,xm=Math.min(x1,x2)-off,y1=e.a.y+e.a.h/2+(e.so||0),y2=e.b.y+e.b.h/2+(e.si||0);
    drawEdge(svg,polyD([[x1,y1],[xm,y1],[xm,y2],[x2,y2]]),{idx:e.i,dash:1,back:1,label:lab(e.r,e.i)?e.r.label:'',lx:x1-8,ly:y1-6,anchor:'end'})})}

function n8nToC4(wf){
  const spec=(BASE.match(/specification\s*\{/)?BASE.slice(BASE.indexOf('specification'),matchBrace(BASE,BASE.indexOf('{',BASE.indexOf('specification')))+1):'');
  const kindOf=t=>/trigger|webhook|cron|schedule/i.test(t)?'triggerStep':/\.(if|switch|filter)$/i.test(t)?'routeStep':/\.(wait|form)$|sendAndWait/i.test(t)?'gateStep':/executeWorkflow/i.test(t)?'subflowStep':/stickyNote/i.test(t)?'noteStep':'autoStep';
  const q=s=>"'"+String(s).replace(/\\/g,'').replace(/'/g,'’')+"'";
  const ids=new Map();(wf.nodes||[]).forEach((n,i)=>ids.set(n.name,'n'+(i+1)));
  const L=['model {','  wf = orgBox '+q(wf.name||'n8n workflow')+' {',"    description 'out: وارد شده از n8n'"];
  (wf.nodes||[]).filter(n=>!/stickyNote/.test(n.type)).forEach(n=>{L.push(`    ${ids.get(n.name)} = ${kindOf(n.type)} ${q(n.name)} {`,`      technology ${q('n8n: '+n.type.replace(/^n8n-nodes-base\./,''))}`,`      metadata {`,`        n8n_pos ${q((n.position||[0,0]).join(','))}`,`      }`,`    }`)});
  Object.entries(wf.connections||{}).forEach(([from,c])=>(c.main||[]).forEach((outs,oi)=>(outs||[]).forEach(o=>{if(ids.has(from)&&ids.has(o.node)){
    const isIf=/\.if$/.test((wf.nodes.find(n=>n.name===from)||{}).type||''),lb=isIf?(oi===0?'true':'false'):((c.main.length>1)?'output '+oi:'بعد');
    L.push(`    ${ids.get(from)} -> ${ids.get(o.node)} ${q(lb)}`)}})));
  L.push('  }','}','','views {','  view index {','    include *','  }','  view wf of wf {','    include *','  }','}');
  return spec+'\n\n'+L.join('\n')+'\n'}
