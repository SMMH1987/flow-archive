<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>استودیو روی LikeC4</title>
<style>
:root{--bg:#f5f5f5;--card:#fff;--ink:#1f2937;--mute:#6b7280;--line:#d6d9de;--grp:#eef1f5;--acc:#ea4b71}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17181c;--card:#23252b;--ink:#e5e7eb;--mute:#9ca3af;--line:#3a3d45;--grp:#1d1f24}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Vazirmatn,Tahoma,system-ui;height:100vh;display:grid;grid-template-rows:auto 1fr auto}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--line)}
header b{font-size:15px}.badge{background:#0e7490;color:#fff;border-radius:6px;padding:1px 8px;font-size:12px}
button,select,input,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:4px 10px}
button{cursor:pointer}button.on,button.pri{background:var(--acc);border-color:var(--acc);color:#fff}button.danger{color:#dc2626}button:disabled{opacity:.4}
#files,#views{display:flex;gap:6px;flex-wrap:wrap}
main{display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:0}
#cv{position:relative;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:20px 20px;cursor:grab}
#svg{width:100%;height:100%;display:block;direction:ltr}
#side{border-inline-start:1px solid var(--line);background:var(--card);padding:12px;overflow:auto}
#side label{display:block;margin:8px 0;font-size:12.5px;color:var(--mute)}#side input,#side textarea,#side select{display:block;width:100%;margin-top:3px;color:var(--ink)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}.mute{color:var(--mute)}.ok{color:#16a34a}.errs{color:#dc2626;padding-inline-start:18px}
.ltr{direction:ltr;unicode-bidi:isolate;color:var(--mute)}
#bottom{padding:8px 14px;background:var(--card);border-top:1px solid var(--line)}.log{white-space:pre;font:12px ui-monospace,monospace;color:var(--mute);max-height:90px;overflow:auto}
details#src{position:fixed;inset:auto 16px 70px auto;width:min(620px,90vw);z-index:5}details#src:not([open]){display:none}
#srcta{width:100%;height:50vh;direction:ltr;font:12px ui-monospace,monospace;background:var(--card)}
text.nt{font-size:16px;font-weight:600;fill:var(--ink);font-family:Vazirmatn,Tahoma}text.ns{font-size:13px;fill:var(--mute);font-family:Vazirmatn,Tahoma}
text.gt{font-size:14px;font-weight:700;fill:var(--mute);direction:rtl;font-family:Vazirmatn,Tahoma}text.el{font-size:11px;fill:var(--mute);font-family:Vazirmatn,Tahoma}
.nd{cursor:pointer}.nd:hover rect:first-child{filter:drop-shadow(0 3px 6px #0002)}
#fitb{position:absolute;left:12px;bottom:12px}
@media(max-width:800px){main{grid-template-columns:1fr;grid-template-rows:1fr auto}#side{max-height:40vh;border:0;border-top:1px solid var(--line)}}
</style></head><body>
<header><b>استودیو روی موتور LikeC4</b><span class="badge">نمونه</span><span id="files"></span><span id="views"></span><span id="status" class="mute"></span></header>
<main><div id="cv"><svg id="svg"></svg><button id="fitb" title="جا دادن">⤢</button></div><aside id="side"></aside></main>
<div id="bottom"></div>
<details id="src"><summary>متن .c4 (تنها منبع؛ تغییر بده و بیرون کلیک کن)</summary><textarea id="srcta"></textarea></details>
<script type="application/json" id="sources">__SOURCES__</script>
<script type="module">__APP__</script>
</body></html>
